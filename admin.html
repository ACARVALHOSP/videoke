<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração - Karaokê 🎤</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="hero-kicker">Videokê</p>
      <h1>Administração 🎚️</h1>
    </header>

    <section class="card">
      <h2>Cadastrar Novo Usuário</h2>
      <form id="cadastroForm" class="cadastro-form">
        <div class="field">
          <label for="nome">Nome do usuário</label>
          <input type="text" id="nome" placeholder="Nome do usuário" autocomplete="off">
        </div>
        <div class="field">
          <label for="valorPago">Valor pago (R$)</label>
          <input type="number" id="valorPago" placeholder="0,00" min="0" step="0.01">
        </div>
        <button type="submit">Cadastrar</button>
      </form>
      <div id="cadastroStatus" class="status-msg"></div>
    </section>

    <section class="card">
      <div class="card-header-row">
        <h2>Controle de Usuários</h2>
        <button type="button" id="btnResetarContagem" class="secondary">🔄 Resetar Contagem de Músicas</button>
      </div>
      <div id="usuarios" class="usuarios-lista"></div>
    </section>

    <section class="card">
      <div class="card-header-row">
        <h2>Playlist</h2>
        <button type="button" id="btnLimparFila" class="danger">🗑️ Limpar Playlist</button>
      </div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
